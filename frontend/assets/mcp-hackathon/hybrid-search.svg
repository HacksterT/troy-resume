<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 540" width="920" height="540" role="img" aria-labelledby="t d" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif">
<title id="t">Hybrid search pipeline</title><desc id="d">A query becomes a keyword query and a local query vector. Keywords run BM25 over recommendations, corrective actions, and PDF pages. The vector runs cosine similarity over recommendations and corrective actions. The four recommendation lists merge by reciprocal rank fusion with k of 60 into a ranked shortlist of up to 100, returned with up to 5 PDF page hits.</desc>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#555555"/></marker></defs>
<rect width="920" height="540" fill="#ffffff"/>
<rect x="250" y="14" width="430" height="62" rx="9" fill="#2c3e50" stroke="#2c3e50" stroke-width="1.5"/><text x="465.0" y="41.5" text-anchor="middle" font-size="15" font-weight="700" fill="#ffffff">Query, in any wording</text><text x="465.0" y="60.5" text-anchor="middle" font-size="12.5" fill="#d6e4ee">a question or a full sentence, plus optional filters</text><rect x="120" y="116" width="320" height="66" rx="9" fill="#ffffff" stroke="#cfd6dc" stroke-width="1.5"/><text x="280.0" y="145.5" text-anchor="middle" font-size="15" font-weight="700" fill="#2c3e50">Keyword query</text><text x="280.0" y="164.5" text-anchor="middle" font-size="12.5" fill="#555555">stopwords removed, words joined with OR</text><rect x="570" y="116" width="330" height="66" rx="9" fill="#ffffff" stroke="#cfd6dc" stroke-width="1.5"/><text x="735.0" y="145.5" text-anchor="middle" font-size="15" font-weight="700" fill="#2c3e50">Query vector</text><text x="735.0" y="164.5" text-anchor="middle" font-size="12.5" fill="#555555">nomic-embed-text v1.5, local, 768-d, 5 s timeout</text><path d="M400 76 L280 116" fill="none" stroke="#555555" stroke-width="1.6" marker-end="url(#a)"/><path d="M530 76 L735 116" fill="none" stroke="#555555" stroke-width="1.6" marker-end="url(#a)"/><rect x="20" y="226" width="160" height="84" rx="9" fill="#ffffff" stroke="#cfd6dc" stroke-width="1.5"/><text x="100.0" y="256.0" text-anchor="middle" font-size="15" font-weight="700" fill="#2c3e50">PDF pages</text><text x="100.0" y="275.0" text-anchor="middle" font-size="12.5" fill="#555555">BM25, top 5</text><text x="100.0" y="292.0" text-anchor="middle" font-size="12.5" fill="#555555">separate list</text><rect x="200" y="226" width="160" height="84" rx="9" fill="#eaf4fb" stroke="#3498db" stroke-width="1.5"/><text x="280.0" y="256.0" text-anchor="middle" font-size="15" font-weight="700" fill="#2c3e50">Recommendations</text><text x="280.0" y="275.0" text-anchor="middle" font-size="12.5" fill="#555555">BM25</text><text x="280.0" y="292.0" text-anchor="middle" font-size="12.5" fill="#555555">top 200</text><rect x="380" y="226" width="160" height="84" rx="9" fill="#eaf4fb" stroke="#3498db" stroke-width="1.5"/><text x="460.0" y="256.0" text-anchor="middle" font-size="15" font-weight="700" fill="#2c3e50">Corrective actions</text><text x="460.0" y="275.0" text-anchor="middle" font-size="12.5" fill="#555555">BM25</text><text x="460.0" y="292.0" text-anchor="middle" font-size="12.5" fill="#555555">top 200</text><rect x="560" y="226" width="160" height="84" rx="9" fill="#eaf4fb" stroke="#3498db" stroke-width="1.5"/><text x="640.0" y="256.0" text-anchor="middle" font-size="15" font-weight="700" fill="#2c3e50">Recommendations</text><text x="640.0" y="275.0" text-anchor="middle" font-size="12.5" fill="#555555">cosine</text><text x="640.0" y="292.0" text-anchor="middle" font-size="12.5" fill="#555555">top 200</text><rect x="740" y="226" width="160" height="84" rx="9" fill="#eaf4fb" stroke="#3498db" stroke-width="1.5"/><text x="820.0" y="256.0" text-anchor="middle" font-size="15" font-weight="700" fill="#2c3e50">Corrective actions</text><text x="820.0" y="275.0" text-anchor="middle" font-size="12.5" fill="#555555">cosine</text><text x="820.0" y="292.0" text-anchor="middle" font-size="12.5" fill="#555555">top 200</text><path d="M190 182 L100 226" fill="none" stroke="#555555" stroke-width="1.6" marker-end="url(#a)"/><path d="M280 182 L280 226" fill="none" stroke="#555555" stroke-width="1.6" marker-end="url(#a)"/><path d="M370 182 L460 226" fill="none" stroke="#555555" stroke-width="1.6" marker-end="url(#a)"/><path d="M690 182 L640 226" fill="none" stroke="#555555" stroke-width="1.6" marker-end="url(#a)"/><path d="M780 182 L820 226" fill="none" stroke="#555555" stroke-width="1.6" marker-end="url(#a)"/><rect x="200" y="352" width="700" height="66" rx="9" fill="#2c3e50" stroke="#2c3e50" stroke-width="1.5"/><text x="550.0" y="381.5" text-anchor="middle" font-size="15" font-weight="700" fill="#ffffff">Reciprocal rank fusion, k = 60</text><text x="550.0" y="400.5" text-anchor="middle" font-size="12.5" fill="#d6e4ee">each list adds 1 / (60 + rank); merged on rec_id, so a finding several lists agree on rises</text><path d="M280 310 L280 352" fill="none" stroke="#555555" stroke-width="1.6" marker-end="url(#a)"/><path d="M460 310 L460 352" fill="none" stroke="#555555" stroke-width="1.6" marker-end="url(#a)"/><path d="M640 310 L640 352" fill="none" stroke="#555555" stroke-width="1.6" marker-end="url(#a)"/><path d="M820 310 L820 352" fill="none" stroke="#555555" stroke-width="1.6" marker-end="url(#a)"/><rect x="20" y="460" width="880" height="66" rx="9" fill="#eaf4fb" stroke="#3498db" stroke-width="1.5"/><text x="460.0" y="489.5" text-anchor="middle" font-size="15" font-weight="700" fill="#2c3e50">Ranked shortlist of up to 100 recommendations</text><text x="460.0" y="508.5" text-anchor="middle" font-size="12.5" fill="#555555">each with matched_by, plus search_mode and up to 5 PDF page hits</text><path d="M100 310 L100 460" fill="none" stroke="#555555" stroke-width="1.6" marker-end="url(#a)"/><path d="M550 418 L550 460" fill="none" stroke="#555555" stroke-width="1.6" marker-end="url(#a)"/>
</svg>
