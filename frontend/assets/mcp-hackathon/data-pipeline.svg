<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 930 378" width="930" height="378" role="img" aria-labelledby="t d" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif">
<title id="t">Data pipeline</title><desc id="d">Four stages run in order and stop at the first failure. Collect crawls the listing, facets, report pages, and PDFs. Structure parses offline, ingests, and indexes. Analyze embeds text and derives facilities and clusters. Release validates against OIG, writes a checksummed snapshot, and publishes with an atomic swap.</desc>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#555555"/></marker></defs>
<rect width="930" height="378" fill="#ffffff"/>
<rect x="12" y="12" width="906" height="78" rx="10" fill="#f6f8fa" stroke="#cfd6dc"/><text x="30" y="57" font-size="14" font-weight="700" fill="#2c3e50">Collect</text><rect x="150" y="22" width="171.5" height="58" rx="9" fill="#ffffff" stroke="#cfd6dc" stroke-width="1.5"/><text x="235.75" y="47.5" text-anchor="middle" font-size="15" font-weight="700" fill="#2c3e50">Listing</text><text x="235.75" y="66.5" text-anchor="middle" font-size="12.5" fill="#555555">all report rows</text><path d="M321.5 51 L343.5 51" fill="none" stroke="#555555" stroke-width="1.6" marker-end="url(#a)"/><rect x="343.5" y="22" width="171.5" height="58" rx="9" fill="#ffffff" stroke="#cfd6dc" stroke-width="1.5"/><text x="429.25" y="47.5" text-anchor="middle" font-size="15" font-weight="700" fill="#2c3e50">Facets</text><text x="429.25" y="66.5" text-anchor="middle" font-size="12.5" fill="#555555">VISN, state, topic</text><path d="M515.0 51 L537.0 51" fill="none" stroke="#555555" stroke-width="1.6" marker-end="url(#a)"/><rect x="537.0" y="22" width="171.5" height="58" rx="9" fill="#ffffff" stroke="#cfd6dc" stroke-width="1.5"/><text x="622.75" y="47.5" text-anchor="middle" font-size="15" font-weight="700" fill="#2c3e50">Report pages</text><text x="622.75" y="66.5" text-anchor="middle" font-size="12.5" fill="#555555">PDF links, dates</text><path d="M708.5 51 L730.5 51" fill="none" stroke="#555555" stroke-width="1.6" marker-end="url(#a)"/><rect x="730.5" y="22" width="171.5" height="58" rx="9" fill="#ffffff" stroke="#cfd6dc" stroke-width="1.5"/><text x="816.25" y="47.5" text-anchor="middle" font-size="15" font-weight="700" fill="#2c3e50">PDFs</text><text x="816.25" y="66.5" text-anchor="middle" font-size="12.5" fill="#555555">3.5 GB, allow-listed</text><path d="M465 90 L465 104" fill="none" stroke="#555555" stroke-width="1.6" marker-end="url(#a)"/><rect x="12" y="104" width="906" height="78" rx="10" fill="#f6f8fa" stroke="#cfd6dc"/><text x="30" y="149" font-size="14" font-weight="700" fill="#2c3e50">Structure</text><rect x="150" y="114" width="236.0" height="58" rx="9" fill="#ffffff" stroke="#cfd6dc" stroke-width="1.5"/><text x="268.0" y="139.5" text-anchor="middle" font-size="15" font-weight="700" fill="#2c3e50">Parse</text><text x="268.0" y="158.5" text-anchor="middle" font-size="12.5" fill="#555555">offline, rule-based</text><path d="M386.0 143 L408.0 143" fill="none" stroke="#555555" stroke-width="1.6" marker-end="url(#a)"/><rect x="408.0" y="114" width="236.0" height="58" rx="9" fill="#ffffff" stroke="#cfd6dc" stroke-width="1.5"/><text x="526.0" y="139.5" text-anchor="middle" font-size="15" font-weight="700" fill="#2c3e50">Ingest</text><text x="526.0" y="158.5" text-anchor="middle" font-size="12.5" fill="#555555">idempotent per run</text><path d="M644.0 143 L666.0 143" fill="none" stroke="#555555" stroke-width="1.6" marker-end="url(#a)"/><rect x="666.0" y="114" width="236.0" height="58" rx="9" fill="#ffffff" stroke="#cfd6dc" stroke-width="1.5"/><text x="784.0" y="139.5" text-anchor="middle" font-size="15" font-weight="700" fill="#2c3e50">Index</text><text x="784.0" y="158.5" text-anchor="middle" font-size="12.5" fill="#555555">FTS5, rebuilt</text><path d="M465 182 L465 196" fill="none" stroke="#555555" stroke-width="1.6" marker-end="url(#a)"/><rect x="12" y="196" width="906" height="78" rx="10" fill="#f6f8fa" stroke="#cfd6dc"/><text x="30" y="241" font-size="14" font-weight="700" fill="#2c3e50">Analyze</text><rect x="150" y="206" width="365.0" height="58" rx="9" fill="#ffffff" stroke="#cfd6dc" stroke-width="1.5"/><text x="332.5" y="231.5" text-anchor="middle" font-size="15" font-weight="700" fill="#2c3e50">Embed</text><text x="332.5" y="250.5" text-anchor="middle" font-size="12.5" fill="#555555">768-d, by text hash</text><path d="M515.0 235 L537.0 235" fill="none" stroke="#555555" stroke-width="1.6" marker-end="url(#a)"/><rect x="537.0" y="206" width="365.0" height="58" rx="9" fill="#ffffff" stroke="#cfd6dc" stroke-width="1.5"/><text x="719.5" y="231.5" text-anchor="middle" font-size="15" font-weight="700" fill="#2c3e50">Derive</text><text x="719.5" y="250.5" text-anchor="middle" font-size="12.5" fill="#555555">facilities, clusters</text><path d="M465 274 L465 288" fill="none" stroke="#555555" stroke-width="1.6" marker-end="url(#a)"/><rect x="12" y="288" width="906" height="78" rx="10" fill="#f6f8fa" stroke="#cfd6dc"/><text x="30" y="333" font-size="14" font-weight="700" fill="#2c3e50">Release</text><rect x="150" y="298" width="236.0" height="58" rx="9" fill="#ffffff" stroke="#cfd6dc" stroke-width="1.5"/><text x="268.0" y="323.5" text-anchor="middle" font-size="15" font-weight="700" fill="#2c3e50">Validate</text><text x="268.0" y="342.5" text-anchor="middle" font-size="12.5" fill="#555555">compare with OIG</text><path d="M386.0 327 L408.0 327" fill="none" stroke="#555555" stroke-width="1.6" marker-end="url(#a)"/><rect x="408.0" y="298" width="236.0" height="58" rx="9" fill="#ffffff" stroke="#cfd6dc" stroke-width="1.5"/><text x="526.0" y="323.5" text-anchor="middle" font-size="15" font-weight="700" fill="#2c3e50">Snapshot</text><text x="526.0" y="342.5" text-anchor="middle" font-size="12.5" fill="#555555">checksummed copy</text><path d="M644.0 327 L666.0 327" fill="none" stroke="#555555" stroke-width="1.6" marker-end="url(#a)"/><rect x="666.0" y="298" width="236.0" height="58" rx="9" fill="#ffffff" stroke="#cfd6dc" stroke-width="1.5"/><text x="784.0" y="323.5" text-anchor="middle" font-size="15" font-weight="700" fill="#2c3e50">Publish</text><text x="784.0" y="342.5" text-anchor="middle" font-size="12.5" fill="#555555">atomic swap</text>
</svg>
