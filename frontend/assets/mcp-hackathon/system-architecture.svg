<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 446" width="940" height="446" role="img" aria-labelledby="t d" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif">
<title id="t">System architecture</title><desc id="d">OIG public pages flow through a crawl into a pipeline on a local Mac mini, which writes a raw store and a build database, then publishes a read-only SQLite database. A containerized FastAPI service reads it, using a local Ollama model for query vectors, and reaches the internet only through an outbound Cloudflare tunnel. Cloudflare Access requires a service token. The oig-mcp server calls the API and serves tools to any MCP-capable AI assistant.</desc>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#555555"/></marker></defs>
<rect width="940" height="446" fill="#ffffff"/>
<rect x="168" y="20" width="532" height="410" rx="14" fill="#f6f8fa" stroke="#cfd6dc" stroke-dasharray="6 5"/><text x="186" y="46" font-size="13" font-weight="700" fill="#555555">LOCAL HOST: MAC MINI</text><rect x="16" y="190" width="128" height="80" rx="9" fill="#eaf4fb" stroke="#3498db" stroke-width="1.5"/><text x="80.0" y="218.0" text-anchor="middle" font-size="15" font-weight="700" fill="#2c3e50">vaoig.gov</text><text x="80.0" y="237.0" text-anchor="middle" font-size="12.5" fill="#555555">public pages</text><text x="80.0" y="254.0" text-anchor="middle" font-size="12.5" fill="#555555">and PDFs</text><rect x="186" y="62" width="160" height="64" rx="9" fill="#ffffff" stroke="#cfd6dc" stroke-width="1.5"/><text x="266.0" y="90.5" text-anchor="middle" font-size="15" font-weight="700" fill="#2c3e50">Raw store</text><text x="266.0" y="109.5" text-anchor="middle" font-size="12.5" fill="#555555">3.7 GB, kept untouched</text><rect x="186" y="186" width="160" height="88" rx="9" fill="#2c3e50" stroke="#2c3e50" stroke-width="1.5"/><text x="266.0" y="218.0" text-anchor="middle" font-size="15" font-weight="700" fill="#ffffff">Pipeline</text><text x="266.0" y="237.0" text-anchor="middle" font-size="12.5" fill="#d6e4ee">crawl, parse, ingest,</text><text x="266.0" y="254.0" text-anchor="middle" font-size="12.5" fill="#d6e4ee">embed, derive, validate</text><rect x="186" y="336" width="160" height="64" rx="9" fill="#ffffff" stroke="#cfd6dc" stroke-width="1.5"/><text x="266.0" y="364.5" text-anchor="middle" font-size="15" font-weight="700" fill="#2c3e50">work.sqlite</text><text x="266.0" y="383.5" text-anchor="middle" font-size="12.5" fill="#555555">build database</text><rect x="380" y="62" width="150" height="64" rx="9" fill="#ffffff" stroke="#cfd6dc" stroke-width="1.5"/><text x="455.0" y="90.5" text-anchor="middle" font-size="15" font-weight="700" fill="#2c3e50">Ollama</text><text x="455.0" y="109.5" text-anchor="middle" font-size="12.5" fill="#555555">nomic-embed-text</text><rect x="380" y="186" width="150" height="88" rx="9" fill="#2c3e50" stroke="#2c3e50" stroke-width="1.5"/><text x="455.0" y="218.0" text-anchor="middle" font-size="15" font-weight="700" fill="#ffffff">Data API</text><text x="455.0" y="237.0" text-anchor="middle" font-size="12.5" fill="#d6e4ee">FastAPI on uvicorn,</text><text x="455.0" y="254.0" text-anchor="middle" font-size="12.5" fill="#d6e4ee">in a container</text><rect x="380" y="336" width="150" height="64" rx="9" fill="#ffffff" stroke="#cfd6dc" stroke-width="1.5"/><text x="455.0" y="364.5" text-anchor="middle" font-size="15" font-weight="700" fill="#2c3e50">oig.sqlite</text><text x="455.0" y="383.5" text-anchor="middle" font-size="12.5" fill="#555555">457 MB, read-only</text><rect x="556" y="186" width="126" height="88" rx="9" fill="#ffffff" stroke="#cfd6dc" stroke-width="1.5"/><text x="619.0" y="218.0" text-anchor="middle" font-size="15" font-weight="700" fill="#2c3e50">cloudflared</text><text x="619.0" y="237.0" text-anchor="middle" font-size="12.5" fill="#555555">outbound-only</text><text x="619.0" y="254.0" text-anchor="middle" font-size="12.5" fill="#555555">tunnel</text><rect x="742" y="186" width="160" height="88" rx="9" fill="#eaf4fb" stroke="#3498db" stroke-width="1.5"/><text x="822.0" y="218.0" text-anchor="middle" font-size="15" font-weight="700" fill="#2c3e50">Cloudflare Access</text><text x="822.0" y="237.0" text-anchor="middle" font-size="12.5" fill="#555555">service token</text><text x="822.0" y="254.0" text-anchor="middle" font-size="12.5" fill="#555555">required</text><rect x="742" y="318" width="160" height="64" rx="9" fill="#2c3e50" stroke="#2c3e50" stroke-width="1.5"/><text x="822.0" y="346.5" text-anchor="middle" font-size="15" font-weight="700" fill="#ffffff">oig-mcp</text><text x="822.0" y="365.5" text-anchor="middle" font-size="12.5" fill="#d6e4ee">seven MCP tools</text><rect x="742" y="62" width="160" height="64" rx="9" fill="#eaf4fb" stroke="#3498db" stroke-width="1.5"/><text x="822.0" y="90.5" text-anchor="middle" font-size="15" font-weight="700" fill="#2c3e50">AI assistant</text><text x="822.0" y="109.5" text-anchor="middle" font-size="12.5" fill="#555555">any MCP client</text><path d="M144 230 L186 230" fill="none" stroke="#555555" stroke-width="1.6" marker-end="url(#a)"/><text x="80" y="290" text-anchor="middle" font-size="12" fill="#555555">polite crawl:</text><text x="80" y="306" text-anchor="middle" font-size="12" fill="#555555">1 request per 1.5 s</text><path d="M266 186 L266 126" fill="none" stroke="#555555" stroke-width="1.6" marker-end="url(#a)"/><path d="M266 274 L266 336" fill="none" stroke="#555555" stroke-width="1.6" marker-end="url(#a)"/><path d="M346 368 L380 368" fill="none" stroke="#555555" stroke-width="1.6" marker-end="url(#a)"/><text x="363" y="412" text-anchor="middle" font-size="12" fill="#555555">atomic publish</text><path d="M455 336 L455 274" fill="none" stroke="#555555" stroke-width="1.6" marker-end="url(#a)"/><path d="M455 186 L455 126" fill="none" stroke="#555555" stroke-width="1.6" marker-end="url(#a)"/><text x="462" y="160" text-anchor="start" font-size="12" fill="#555555">query vectors</text><path d="M346 212 L364 212 L364 94 L380 94" fill="none" stroke="#555555" stroke-width="1.6" marker-end="url(#a)"/><path d="M530 230 L556 230" fill="none" stroke="#555555" stroke-width="1.6" marker-end="url(#a)"/><path d="M682 230 L742 230" fill="none" stroke="#555555" stroke-width="1.6" marker-end="url(#a)"/><path d="M822 274 L822 318" fill="none" stroke="#555555" stroke-width="1.6" marker-end="url(#a)"/><text x="832" y="300" text-anchor="start" font-size="12" fill="#555555">https + token</text><path d="M902 350 H924 V94 H902" fill="none" stroke="#555555" stroke-width="1.6" marker-end="url(#a)"/><text x="822" y="154" text-anchor="middle" font-size="12" fill="#555555">MCP tools, cited answers</text>
</svg>
